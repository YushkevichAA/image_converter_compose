services:
  api:
    build:
      context: .
      dockerfile: ./apps/api/Dockerfile
    restart: always
    container_name: api
    ports:
      - 3002:3000
    networks:
      - myNetwork
    volumes:
      - ./.env:/opt/app/.env
    depends_on:
      - rmq

  app:
    build:
      context: .
      dockerfile: ./apps/app/Dockerfile
    restart: always
    container_name: app
    networks:
      - myNetwork
    ports:
      - 3001:80
    depends_on:
      - api
    volumes:
      - ./.env:/opt/app/.env

  converter:
    build:
      context: .
      dockerfile: ./apps/converter/Dockerfile
    container_name: converter
    networks:
      - myNetwork
    volumes:
      - ./.env:/opt/app/.env
    depends_on:
      - rmq

  rmq:
    image: rabbitmq:4.3.0-management
    restart: always
    networks:
      - myNetwork
    environment:
      - RABBITMQ_DEFAULT_USER=admin
      - RABBITMQ_DEFAULT_PASS=admin
    ports:
      - 5672:5672

networks:
  myNetwork:
    driver: bridge
